---

- name: Prepare config dir
  ansible.builtin.file:
    path: /etc/nullmailer
    state: directory
    mode: '0755'
  become: true

- name: Configure generic mail settings
  ansible.builtin.template:
    src: mailname
    dest: /etc/mailname
    mode: '644'
  notify: nullmailer_restart
  become: true

- name: Configure nullmailer
  ansible.builtin.template:
    src: '{{ item.name }}'
    dest: /etc/nullmailer/{{ item.name }}
    mode: '{{ item.mode | default("644") }}'
    owner: '{{ item.owner | default("root") }}'
    group: '{{ item.group | default("root") }}'
  with_items:
    - name: adminaddr
    - name: defaultdomain
    - name: defaulthost
    - name: helohost
    - name: idhost
    - name: pausetime
    - name: remotes
      group: mail
      mode: '640'
    - name: sendtimeout
  notify: nullmailer_restart
  become: true

- name: Configure allmailfrom
  ansible.builtin.template:
    src: allmailfrom
    dest: /etc/nullmailer/allmailfrom
    mode: '0644'
    owner: root
    group: root
  notify: nullmailer_restart
  become: true
  when:
    - nullmailer_allmailfrom is defined
    - nullmailer_allmailfrom | length > 0

- name: Install
  ansible.builtin.apt:
    name: nullmailer
    default_release: '{{ nullmailer_default_release }}'
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Install watchdog script
  ansible.builtin.copy:
    src: nullmailer-watchdog.sh
    dest: /usr/local/bin/nullmailer-watchdog
    mode: '0755'
    owner: root
    group: root
  become: true

- name: Install watchdog service unit
  ansible.builtin.template:
    src: nullmailer-watchdog.service
    dest: /etc/systemd/system/nullmailer-watchdog.service
    mode: '0644'
    owner: root
    group: root
  notify: nullmailer_daemon_reload
  become: true

- name: Install watchdog timer unit
  ansible.builtin.copy:
    src: nullmailer-watchdog.timer
    dest: /etc/systemd/system/nullmailer-watchdog.timer
    mode: '0644'
    owner: root
    group: root
  notify: nullmailer_daemon_reload
  become: true

- name: Enable watchdog timer
  ansible.builtin.systemd:
    name: nullmailer-watchdog.timer
    enabled: true
    state: started
  become: true
